# Optional Prometheus + Grafana stack — merge on top of docker-compose.yml
# to scrape the server's own /metrics endpoint (requires an Extended
# licence or higher, see ../veiraseal/docs/api.md) and get a ready-made
# dashboard:
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# One-time setup before starting: set GRAFANA_ADMIN_PASSWORD in .env.
# Unlike a Bearer-token-scraped app, /metrics needs no credential to reach
# it (the licence check is the gate), so there's no token file to manage.
#
# Grafana is reachable at http://localhost:3001 (admin / GRAFANA_ADMIN_PASSWORD)
# with the "Veira Seal — Overview" dashboard already provisioned — no manual
# datasource or import step needed. Prometheus itself is exposed at :9090
# for ad-hoc queries.
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.6
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
